# ZLO on Rune: native Rune client for the local IronClaw gateway.
#
# A full rewrite of `tools/ironclaw_gpui/app` on Rune
# (github.com/anomalyco/rune). The GPUI app is left untouched beside it; both
# share the GUI-free gateway client (`tools/ironclaw_gpui/client`).
# Its own workspace root, so Rune never enters the main IronClaw build.
[workspace]
resolver = "3"
members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared with the GPUI app; it knows nothing about either UI toolkit.
ironclaw_gpui_client = { path = "../ironclaw_gpui/client" }
ironclaw_host_api = { path = "../../crates/contracts/ironclaw_host_api" }

# Pinned rev of Rune's fast-forward-only `dev` branch. Bump on purpose.
rune = { git = "https://github.com/anomalyco/rune", rev = "53c7f60f51ce12bd5da53145d9d86ce1552324e4", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "53c7f60f51ce12bd5da53145d9d86ce1552324e4", features = ["markdown"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies (Rune, wgpu, tokio, ...) build lightly optimized in dev: the
# unoptimized binary's unwind table outgrew ld's 16 MB compact-unwind limit
# (a linker warning on every build), and scenes render faster. The app's own
# crate stays at opt-level 0 for debugging.
[profile.dev.package."*"]
opt-level = 1
