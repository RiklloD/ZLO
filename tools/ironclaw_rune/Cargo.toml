# ZLO: the native Rune desktop app for the local IronClaw gateway.
#
# Built on Rune (github.com/anomalyco/rune). It replaced the earlier GPUI app,
# which is archived on the `archive/gpui` branch (tag `gpui-final`).
# `client/` is the UI-free gateway client. Its own workspace root, so Rune
# never enters the main IronClaw build.
[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# UI-free gateway client (HTTP + SSE); it knows nothing about Rune.
zlo_client = { path = "client" }
# Wire contracts owned by the gateway. Contracts-layer only (serde + ids, no
# web server or storage), so sharing them keeps client and server in
# lockstep: an upstream contract change fails `cargo check` here.
ironclaw_product_contracts = { path = "../../crates/contracts/ironclaw_product_contracts" }
ironclaw_host_api = { path = "../../crates/contracts/ironclaw_host_api" }
ironclaw_extension_contracts = { path = "../../crates/contracts/ironclaw_extension_contracts" }

# Pinned rev of Rune's fast-forward-only `dev` branch. Bump on purpose.
rune = { git = "https://github.com/anomalyco/rune", rev = "53c7f60f51ce12bd5da53145d9d86ce1552324e4", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "53c7f60f51ce12bd5da53145d9d86ce1552324e4", features = ["markdown"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies (Rune, wgpu, tokio, ...) build lightly optimized in dev: the
# unoptimized binary's unwind table outgrew ld's 16 MB compact-unwind limit
# (a linker warning on every build), and scenes render faster. The app's own
# crate stays at opt-level 0 for debugging.
[profile.dev.package."*"]
opt-level = 1

# Rune with ZLO's energy patches, kept local (Rune takes no PRs): a clone of
# the pinned rev above at ../../../rune-zlo (~/rune-zlo), branch
# `zlo-energy`. It caches the IME cursor area, honours a zero word reveal
# under reduced motion, steps word fades at 40 Hz and adds
# `rune::cap_ambient_motion` (60 Hz once input rests), which main.rs calls.
# Building elsewhere needs that clone: `git clone <rune> ~/rune-zlo`, then
# check out `zlo-energy` (or re-apply its one commit on 53c7f60).
[patch."https://github.com/anomalyco/rune"]
rune = { path = "../../../rune-zlo/crates/rune" }
rune-kit = { path = "../../../rune-zlo/crates/rune-kit" }
