[package]
name = "zlo_client"
description = "UI-free HTTP + SSE client for the IronClaw WebChat v2 gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ironclaw_product_contracts.workspace = true
ironclaw_host_api.workspace = true
ironclaw_extension_contracts.workspace = true
tokio.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true
base64.workspace = true
chrono.workspace = true
tracing.workspace = true
# `@` file listings honor .gitignore in-process, without running git.
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
# Ignore files are opened no-follow and non-blocking (a FIFO cannot hang).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
