[package]
name = "ironclaw_rune"
description = "ZLO: native Rune frontend for the IronClaw gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "zlo"
path = "src/main.rs"

[dependencies]
zlo_client.workspace = true
# Shared file names with the backend and `zlo triage` (pid file, app log).
ironclaw_config.workspace = true
ironclaw_host_api.workspace = true
rune.workspace = true
rune-kit.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true
unicode-normalization.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6"

# AppKit for the native previews (`native_view`); macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
