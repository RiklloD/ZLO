[package]
name = "ironclaw_gpui"
description = "IronClaw Desktop: native GPUI frontend for the IronClaw gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "ironclaw-desktop"
path = "src/main.rs"

[dependencies]
ironclaw_gpui_client.workspace = true
gpui-kit.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
# Wallpaper decode and blur. gpui already links image 0.25, so this adds no new crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dirs = "6"
