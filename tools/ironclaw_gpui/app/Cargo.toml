[package]
name = "ironclaw_gpui"
description = "Numoh: native GPUI frontend for the IronClaw gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "numoh"
path = "src/main.rs"

[dependencies]
ironclaw_gpui_client.workspace = true
# `syntect`: code colors in diffs and Markdown code blocks (the lighter
# of gpui-component's two highlighters; tree-sitter would add ~30 grammars).
gpui-kit = { workspace = true, features = ["syntect"] }
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
# Wallpaper decode and blur. gpui already links image 0.25, so this adds no new crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dirs = "6"
# Native PDF/Office/web previews (`native_view.rs`): plain runtime calls;
# both crates are already in the tree through gpui.
objc2 = "0.6"
raw-window-handle = "0.6"
