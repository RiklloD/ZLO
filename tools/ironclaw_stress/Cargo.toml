[package]
name = "ironclaw_stress"
version = "0.1.0"
edition.workspace = true
default-run = "ironclaw_stress"
rust-version.workspace = true
description = "Stress suite for IronClaw infrastructure bottleneck discovery"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

# `rust_decimal` is named only by the expansion of `rust_decimal_macros::dec!`
# (`::rust_decimal::Decimal::…`), which cargo-shear cannot see.
# `ironclaw_trace_commons` is a dev-dependency only to switch on its
# `test-support` feature (isolated Trace Commons base in tests); no test
# code names it, so cargo-shear cannot see the use.
[package.metadata.cargo-shear]
ignored = ["ironclaw_trace_commons", "rust_decimal"]

[package.metadata.ironclaw]
layer = "app"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
deadpool-postgres = { workspace = true }
ironclaw_filesystem = { path = "../../crates/substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../crates/contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_llm = { path = "../../crates/domains/ironclaw_llm", version = "0.1.0" }
ironclaw_resources = { path = "../../crates/kernel/ironclaw_resources", version = "0.1.0" }
ironclaw_secrets = { path = "../../crates/substrates/ironclaw_secrets", version = "0.1.0" }
ironclaw_threads = { path = "../../crates/domains/ironclaw_threads", version = "0.1.0" }
ironclaw_loop_contracts = { path = "../../crates/contracts/ironclaw_loop_contracts" }
ironclaw_turns = { path = "../../crates/kernel/ironclaw_turns", version = "0.1.0" }
ironclaw_processes = { path = "../../crates/kernel/ironclaw_processes", version = "0.1.0" }
libsql = { workspace = true, features = ["remote", "tls"] }
libc = { workspace = true }
rust_decimal = { workspace = true, features = ["serde", "serde-with-str"] }
rust_decimal_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "query", "rustls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
# Test builds resolve an unset Trace Commons base to an isolated temp dir
# (`ironclaw_trace_commons::location::base_dir`, `test-support`), so tests that
# reach Trace Commons through the runtime never touch the developer's real
# `~/.ironclaw/trace_contributions`.
ironclaw_trace_commons = { path = "../../crates/domains/ironclaw_trace_commons", features = ["test-support"] }
rig = { package = "rig-core", version = "0.36" }
ironclaw_auth = { path = "../../crates/domains/ironclaw_auth" }
ironclaw_composition = { path = "../../crates/app/ironclaw_composition", features = ["test-support"] }
ironclaw_libsql_runtime = { path = "../../crates/substrates/ironclaw_libsql_runtime" }
ironclaw_triggers = { path = "../../crates/domains/ironclaw_triggers" }
secrecy = { workspace = true }
tempfile = { workspace = true }
