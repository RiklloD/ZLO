[package]
name = "ironclaw_event_projections"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
ironclaw_event_log = { path = "../ironclaw_event_log" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
# Only the contract tests build timestamps; the library takes them from callers.
chrono = { workspace = true, features = ["clock"] }
ironclaw_extension_registry = { path = "../../extensions/ironclaw_extension_registry" }
# FaultInjecting decorator: test the projection source-error path through the real store
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
ironclaw_event_store = { path = "../ironclaw_event_store" }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
