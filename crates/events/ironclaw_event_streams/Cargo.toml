[package]
name = "ironclaw_event_streams"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral Reborn projection stream manager"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
ironclaw_event_projections = { path = "../ironclaw_event_projections" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_outbound = { path = "../../domains/ironclaw_outbound" }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "rt"] }

[dev-dependencies]
chrono = { workspace = true, features = ["clock"] }
ironclaw_event_log = { path = "../ironclaw_event_log" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
