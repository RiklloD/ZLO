[package]
name = "ironclaw_event_store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Reborn-owned durable event and audit store backends"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
deadpool-postgres = { workspace = true }
hex = { workspace = true }
ironclaw_event_log = { path = "../ironclaw_event_log", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
libsql = { workspace = true, features = ["remote", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.14"
tracing = { workspace = true }
urlencoding = { workspace = true }
webpki-roots = "1.0"

[dev-dependencies]
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.2" }
# The Postgres contract leg provisions a private database per test through
# the shared `test-support` provisioner (`postgres_isolation`); the crate
# edge already exists as a normal dependency — this entry only turns the
# dev-only feature on for this crate's tests.
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
