[package]
name = "ironclaw_extension_registry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Extension manifest and registry contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Dev-only seam (the repo's one sanctioned name for it): compiles the
# unverified-contents test construction
# (`ExtensionPackage::with_unverified_contents_for_test`), which runs a
# third-party package with no consent-pinned file verification. Never enabled
# by a production build; test targets that need the fixture enable it in
# their dev-dependencies.
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `rt` + `time`: the in-process, bounded preparation-lease repair task.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
deadpool-postgres = { workspace = true }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0", features = ["test-support"] }
libsql = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-postgres = { workspace = true }

[lints]
workspace = true
