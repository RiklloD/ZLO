[package]
name = "ironclaw_memory_native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Memory document service adapters for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Exposes the trait-level contract test harness in
# `src/contract_tests.rs` to downstream crates and integration tests.
# Off by default so panic-style calls in the harness (`.expect`,
# `.unwrap`, `assert*!`) do not appear in production builds and trip
# the `scripts/check_no_panics.py` scanner. This crate's own
# integration tests in `tests/` enable the feature via the self
# dev-dependency below.
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
chrono-tz = { workspace = true }
ironclaw_filesystem = { path = "../../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_memory = { path = "../../../domains/ironclaw_memory", version = "0.1.0" }
ironclaw_safety = { path = "../../../substrates/ironclaw_safety", version = "0.2.1" }
jsonschema = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `time` bounds how long an embedding call may hold a search or a write;
# `sync` shares one query embedding between concurrent recall lanes; `rt`
# spawns the boot-time re-embed backfill (`reembed`).
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# Self dev-dependency enables `test-support` for the crate's
# integration tests in `tests/`, which import the contract suite and
# the `contract_test!` macro. The harness contains `.expect`/`.unwrap`/
# `assert!*` calls (intentional — it's a test harness) and must stay
# gated off in the production-facing build of the library so the
# no-panics scanner only sees production code.
ironclaw_memory_native = { path = ".", features = ["test-support"] }
# The provider-level MemoryService contract suite this crate wires in
# tests/memory_service_contract.rs.
ironclaw_memory = { path = "../../../domains/ironclaw_memory", features = ["test-support"] }
tempfile = { workspace = true }
# Embedding-space parity (tests/embedding_space_backend_parity.rs) runs the
# fingerprinted vector search on the PostgreSQL filesystem backend too:
# `DATABASE_URL` (isolated database per test, via the filesystem crate's
# `test-support` provisioner) else a testcontainers server. Dev-only, so the
# persistence-driver gate (normal dependencies) is unaffected.
ironclaw_filesystem = { path = "../../../substrates/ironclaw_filesystem", features = ["test-support"] }
deadpool-postgres = { workspace = true }
tokio-postgres = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
# The Memory-page archive test runs on the libSQL filesystem backend as well
# as the in-memory one (version-checked delete is backend behavior).
libsql = { workspace = true, features = ["remote", "tls"] }
# `rt-multi-thread` is required by the race-safety test's
# `#[tokio::test(flavor = "multi_thread", worker_threads = 2)]` —
# without it, the macro silently falls back to current-thread and
# `tokio::join!` polls cooperatively on one thread, hiding real
# preemptive races against `replace_document_chunks_if_current`
# (PR #3180 invariant 6).
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
