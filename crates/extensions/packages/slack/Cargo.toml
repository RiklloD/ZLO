[package]
name = "ironclaw_slack_extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Slack channel extension for IronClaw Reborn (#3857)"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "products"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_attachments = { path = "../../../domains/ironclaw_attachments", version = "0.1.0" }
ironclaw_host_api = { path = "../../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_extension_contracts = { path = "../../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_product_contracts = { path = "../../../contracts/ironclaw_product_contracts", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Form-encoded Slack slash-command / ssl_check payloads (PR-3 native
# dispatcher). Already resolved workspace-wide via axum's `Form` extractor
# (used in ironclaw_webui's OAuth callbacks), so this adds zero new compiled
# crates to the dependency graph.
serde_urlencoded = "0.7"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
# Debug-only diagnostics for the advisory conversation-context fetch, which
# degrades every vendor refusal (missing_scope, not_in_channel, transport
# failure) to "no context" instead of surfacing an error.
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The ingress drop log is the only trace a discarded human message leaves, so
# it is asserted rather than assumed. `no-env-filter` because the drop log is
# `debug!`, which the default filter would swallow — the assertion would then
# pass vacuously.
tracing-test = { workspace = true, features = ["no-env-filter"] }
# Property testing for the ingress boundary (#6524 workstream 9).
proptest = { workspace = true }
# `test-support` exposes the shared channel-adapter conformance fakes.
ironclaw_host_api = { path = "../../../contracts/ironclaw_host_api", version = "0.1.0", features = ["test-support"] }
# The exported channel-adapter conformance suite moved here with
# `ChannelAdapter` (WS1.4); `tests/channel_conformance.rs` runs it.
ironclaw_extension_contracts = { path = "../../../contracts/ironclaw_extension_contracts", version = "0.1.0", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
# `tests/agent_app_manifest_lockstep.rs` parses the package's own
# `manifest.toml` to prove every Slack call the code makes is declared
# bot-token egress. Same version the registry uses.
toml = { workspace = true }

[lints]
workspace = true
