[package]
name = "ironclaw_operator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Host/operator control-plane services for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "products"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_common = { path = "../../contracts/ironclaw_common" }
# Operator metrics (`src/metrics/`) fold two durable facts they observe through
# decorators: the redacted runtime events handed to the durable event sink
# (`ironclaw_event_log`) and the approval-request store transitions
# (`ironclaw_approvals::ApprovalRequestStorePort`). Vocabulary + port only —
# no store, dispatcher, or runtime lane.
ironclaw_approvals = { path = "../../kernel/ironclaw_approvals" }
ironclaw_event_log = { path = "../../events/ironclaw_event_log" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
# Host-owned route-mount carriers. Operator owns the NEAR AI login callback
# route; ingress owns the vocabulary that carries a router plus its policy
# descriptors to whoever mounts it (PROPOSAL §6.9.2).
ironclaw_host_ingress = { path = "../ironclaw_host_ingress" }
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts", version = "0.1.0" }
ironclaw_llm = { path = "../../domains/ironclaw_llm", default-features = false }
ironclaw_config = { path = "../../app/ironclaw_config" }
ironclaw_safety = { path = "../../substrates/ironclaw_safety" }
# `LlmProvider::cost_per_token` returns `Decimal`; the metrics provider
# decorator (`src/metrics/llm.rs`) delegates the whole trait.
rust_decimal = { workspace = true }
nix = { version = "0.31", default-features = false, features = ["process"] }
libc = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Metrics decorator tests drive the production approval store over its
# in-memory backend and the `StubLlm` provider double.
ironclaw_approvals = { path = "../../kernel/ironclaw_approvals", features = ["test-support"] }
ironclaw_llm = { path = "../../domains/ironclaw_llm", default-features = false, features = ["test-support"] }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
# The in-memory `OperatorSecretValueStore` fake. WS3 removed this crate's
# `ironclaw_secrets` edge (PROPOSAL §8.2, §12.1b); the substrate-fidelity tests
# moved to the port's implementor in `ironclaw_composition`, and what
# stays here drives operator policy through the port.
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts", features = [
    "test-support",
] }
rust_decimal = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
