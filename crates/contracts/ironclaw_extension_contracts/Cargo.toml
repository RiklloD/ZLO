[package]
name = "ironclaw_extension_contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The extension-tier contract for IronClaw Reborn: what an installable extension declares and exposes — manifest surfaces, auth recipes, lifecycle states, and the vendor-implemented preference-target port"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "contracts"

[features]
# Dev-only seam (rule: cargo-features.md bar #4 — the sanctioned `test-support`
# name). Compiles the exported channel-adapter conformance suite and the
# in-memory reply-sink fake so adapter crates stop hand-rolling them.
# Never enabled by a shipped artifact.
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
# Device-link inputs (login code, account password) cross the host↔extension
# membrane as `SecretString`, so they cannot be echoed into a step, an error,
# or a `Debug` line. Same crate and version the sibling contracts crate uses.
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `SessionBytes` holds a decrypted linked-account credential in memory; the
# wrapper clears it on drop.
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The channel/recipe manifest-surface suites parse the documented `[channel]`
# TOML the same way manifest ingestion does.
toml = { workspace = true }

[lints]
workspace = true
