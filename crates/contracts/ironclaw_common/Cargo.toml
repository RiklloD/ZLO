[package]
name = "ironclaw_common"
version = "0.4.2"
edition.workspace = true
rust-version.workspace = true
description = "Shared types, paths, and platform helpers used across the IronClaw workspace"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
# Internal-only workspace: nothing here is published (PROPOSAL §11.3).
publish = false

[package.metadata.ironclaw]
layer = "contracts"

[package.metadata.dist]
dist = false

[dependencies]
base64 = { workspace = true }
chrono-tz = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
llm-prices = "1.1"
rand = { workspace = true }
rust_decimal = { workspace = true, features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
