[package]
name = "ironclaw_architecture_tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "app"

# `proc-macro2` is declared only to turn on its `span-locations` feature, which
# `syn` spans need for `span().start().line` in the ratchet scanners; no code
# names the crate directly, so cargo-shear cannot see the use.
[package.metadata.cargo-shear]
ignored = ["proc-macro2"]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
# Dev-only: the origin→gate matrix ratchet imports the reviewed Ungated allowlist
# from its owner (so the pin checks the REAL constant, not a copy) and parses the
# hand-authored first-party extension manifest assets. Not a production edge —
# `ironclaw_architecture_tests` ships no runtime code.
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
# Dev-only, same reason: the inspector retention-alignment gate compares the SPA's
# turn-navigation window against the REAL DEFAULT_MAX_RETAINED_RUNS_PER_SESSION
# rather than a transcribed copy that could drift with it.
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts" }
# Dev-only, same reason: the Telegram command-menu gate compares the manifest's
# menu entries against the REAL product command registry
# (`product_command_descriptors()`) so a reworded description in the owner
# cannot silently strand the vendor-registered copy.
ironclaw_assistant = { path = "../../product/ironclaw_assistant" }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full"] }
toml = { workspace = true }
# Dev-only: the #7146 tracing-target gate emits both macro forms through a
# capturing subscriber, so the language fact it enforces is measured rather than
# asserted in a comment.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
