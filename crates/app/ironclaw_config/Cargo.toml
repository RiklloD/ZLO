[package]
name = "ironclaw_config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Boot configuration contracts for the standalone IronClaw Reborn binary"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

# Boundary crate only. Release packaging belongs to the CLI/runtime slices after
# `run`, docs, and `dist plan` are verified.
[package.metadata.dist]
dist = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"

[lints]
workspace = true
