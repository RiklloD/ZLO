[package]
name = "ironclaw_loop_host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Loop host adapters for IronClaw Reborn AgentLoopHost implementations"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

# `ironclaw_trace_commons` is a dev-dependency only to switch on its
# `test-support` feature (isolated Trace Commons base in tests); no test
# code names it, so cargo-shear cannot see the use.
[package.metadata.cargo-shear]
ignored = ["ironclaw_trace_commons"]

[package.metadata.ironclaw]
layer = "loops"

[features]
# Compatibility feature for downstream test configurations; also builds the
# in-memory approval stores `SyntheticApprovalGate::in_memory_for_test` uses.
test-support = ["ironclaw_approvals/test-support", "ironclaw_authorization/test-support"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
dashmap = "6"
futures = { workspace = true }
jsonschema = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
ironclaw_capabilities = { path = "../../kernel/ironclaw_capabilities", version = "0.1.0" }
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.2" }
# The model gateway calls `LlmProvider` directly (WS3 runner sheds, PROPOSAL
# §6.7.2 "gains: runner's model-gateway adapter"). `default-features = false`
# keeps the provider cone out of the default build, matching every other
# `ironclaw_llm` edge in the workspace.
ironclaw_llm = { path = "../../domains/ironclaw_llm", version = "0.1.0", default-features = false }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_processes = { path = "../../kernel/ironclaw_processes", version = "0.1.0" }
ironclaw_host_runtime = { path = "../../kernel/ironclaw_host_runtime", version = "0.1.0" }
ironclaw_observability = { path = "../../substrates/ironclaw_observability" }
ironclaw_outbound = { path = "../../domains/ironclaw_outbound", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_resources = { path = "../../kernel/ironclaw_resources", version = "0.1.0" }
ironclaw_safety = { path = "../../substrates/ironclaw_safety", version = "0.2.2" }
ironclaw_skills = { path = "../../domains/ironclaw_skills", version = "0.3.0", default-features = false }
ironclaw_memory = { path = "../../domains/ironclaw_memory", version = "0.1.0" }
ironclaw_threads = { path = "../../domains/ironclaw_threads", version = "0.1.0" }
ironclaw_loop_contracts = { path = "../../contracts/ironclaw_loop_contracts", version = "0.1.0" }
ironclaw_turns = { path = "../../kernel/ironclaw_turns", version = "0.1.0" }
ironclaw_approvals = { path = "../../kernel/ironclaw_approvals", version = "0.1.0" }
# The lease store the synthetic approval gate claims and consumes an approved
# call's one-shot lease in (`src/synthetic_approval.rs`).
ironclaw_authorization = { path = "../../kernel/ironclaw_authorization", version = "0.1.0" }
rust_decimal = { workspace = true, features = ["serde", "serde-with-str"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
# Test builds resolve an unset Trace Commons base to an isolated temp dir
# (`ironclaw_trace_commons::location::base_dir`, `test-support`), so tests that
# reach Trace Commons through the runtime never touch the developer's real
# `~/.ironclaw/trace_contributions`.
ironclaw_trace_commons = { path = "../../domains/ironclaw_trace_commons", features = ["test-support"] }
http = { workspace = true }
# Dev-only: loop_host's production use of the lane is a single capability-id
# comparison, which now reads `ironclaw_host_api::capability`. Only its tests
# construct sandbox plans, so the Docker/CA cone stays out of the loop tier.
ironclaw_sandbox = { path = "../../lanes/ironclaw_sandbox", version = "0.1.0" }
ironclaw_turns = { path = "../../kernel/ironclaw_turns", version = "0.1.0", features = ["test-support"] }
ironclaw_threads = { path = "../../domains/ironclaw_threads", version = "0.1.0", features = ["test-support"] }
ironclaw_outbound = { path = "../../domains/ironclaw_outbound", version = "0.1.0", features = ["test-support"] }
ironclaw_trust = { path = "../../kernel/ironclaw_trust", version = "0.1.0" }
# In-memory approval/lease stores for the synthetic approval gate's tests.
ironclaw_approvals = { path = "../../kernel/ironclaw_approvals", version = "0.1.0", features = ["test-support"] }
ironclaw_authorization = { path = "../../kernel/ironclaw_authorization", version = "0.1.0", features = ["test-support"] }
reqwest = { workspace = true, features = ["json"] }
rust_decimal_macros = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }

[lints]
workspace = true
