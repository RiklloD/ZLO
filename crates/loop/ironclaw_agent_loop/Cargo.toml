[package]
name = "ironclaw_agent_loop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Agent-loop framework state and strategy contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "loops"

[features]
# Dev-only seam: downstream harnesses use `tokio::sync::Notify` to drive
# cancellation deterministically.
test-support = ["tokio/sync"]

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
futures = { workspace = true }
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.2" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_loop_contracts = { path = "../../contracts/ironclaw_loop_contracts", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_jcs = "0.2"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
chrono = { workspace = true, default-features = true }
futures = { workspace = true }
ironclaw_agent_loop = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
