[package]
name = "ironclaw_turn_runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Reborn runner control plane and loop-driver adapters for IronClaw"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
# PROPOSAL §6.7.3: the runner hosts loop execution. Since #6696 inverted the
# scheduler onto `processes::ProcessSupervisor`, the kernel reaches it only
# through the registered executor port — dependency inversion, kernel defines
# the port — so `loops` is what it is, and the two W7 exceptions it carried
# (`runner -> agent_loop`, `runner -> loop_host`) dissolve rather than being
# allowlisted. Its only consumer is `ironclaw_composition` (`app`).
layer = "loops"

[features]
# Exposes filesystem-backed in-memory test constructors to integration tests and
# downstream harnesses. Off by default so production builds do not carry test
# helpers.
test-support = ["ironclaw_turns/test-support"]

[dependencies]
async-trait = { workspace = true }
# Scope-roster shard-prefix hashing only (§4.5) — same version already used
# by `ironclaw_filesystem` for the identical stable-hex-from-key pattern
# (`db.rs`'s index-name collision suffixing); not a `[workspace.dependencies]`
# entry, so this crate needs its own line.
blake3 = { workspace = true }
chrono = { workspace = true, default-features = true }
futures-util = { workspace = true }
ironclaw_agent_loop = { path = "../ironclaw_agent_loop", version = "0.1.0" }
ironclaw_event_log = { path = "../../events/ironclaw_event_log", version = "0.1.0" }
ironclaw_hooks = { path = "../ironclaw_hooks", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_host_runtime = { path = "../../kernel/ironclaw_host_runtime", version = "0.1.0" }
ironclaw_loop_host = { path = "../ironclaw_loop_host", version = "0.1.0" }
ironclaw_memory = { path = "../../domains/ironclaw_memory", version = "0.1.0" }
ironclaw_observability = { path = "../../substrates/ironclaw_observability" }
ironclaw_outbound = { path = "../../domains/ironclaw_outbound", version = "0.1.0" }
ironclaw_processes = { path = "../../kernel/ironclaw_processes", version = "0.1.0" }
ironclaw_approvals = { path = "../../kernel/ironclaw_approvals", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_threads = { path = "../../domains/ironclaw_threads", version = "0.1.0" }
ironclaw_loop_contracts = { path = "../../contracts/ironclaw_loop_contracts", version = "0.1.0" }
# `trace_capture` is the turn-runner observer half of autonomous Trace Commons
# capture (PROPOSAL §6.10.1, WS6): it adapts a terminal turn's transcript and
# hands it to `ironclaw_trace_commons::capture`, which owns the pipeline.
ironclaw_trace_commons = { path = "../../domains/ironclaw_trace_commons", version = "0.1.0" }
ironclaw_turns = { path = "../../kernel/ironclaw_turns", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# Message ids for the captured-transcript adaptation in `trace_capture`.
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }

[dev-dependencies]
# Binds the process-global Trace Commons base to a temp dir in tests
# (`location::bind_isolated_base_dir_for_tests`) so they never read or write
# the developer's real `~/.ironclaw/trace_contributions`.
ironclaw_trace_commons = { path = "../../domains/ironclaw_trace_commons", features = ["test-support"] }
ironclaw_turn_runner = { path = ".", features = ["test-support"] }
ironclaw_loop_host = { path = "../ironclaw_loop_host", features = ["test-support"] }
chrono = { workspace = true, default-features = true }
ironclaw_agent_loop = { path = "../ironclaw_agent_loop", version = "0.1.0", features = ["test-support"] }
ironclaw_processes = { path = "../../kernel/ironclaw_processes", version = "0.1.0", features = ["test-support"] }
ironclaw_event_store = { path = "../../events/ironclaw_event_store", version = "0.1.0" }
ironclaw_turns = { path = "../../kernel/ironclaw_turns", version = "0.1.0", features = ["test-support"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }


[lints]
workspace = true
