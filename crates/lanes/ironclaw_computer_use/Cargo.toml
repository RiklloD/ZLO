[package]
name = "ironclaw_computer_use"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Computer use: the Open Computer Use binary as a stdio MCP server, one session per thread, with Stop, take over and the latest screenshot frame"
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
# Live view: decode a window capture or the agent's screenshot, scale it and
# re-encode it as a small JPEG (what Pillow did in the Hermes plugin).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
# The session layer implements the MCP lane's `McpClient` seam; the lane's own
# runtime refuses stdio by charter, so only the client contract is shared.
ironclaw_mcp = { path = "../ironclaw_mcp" }
# Declares the `ComputerUseSessions` port this crate implements for product.
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts" }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }
tracing = { workspace = true }
# Unpredictable capture file names.
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# Descriptor-relative file operations (openat/mkdirat/unlinkat/fstat/fchmod)
# for the private capture and cursor directories.
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# CGWindowListCopyWindowInfo: which window an app's state belongs to.
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process"] }

[lints]
workspace = true
