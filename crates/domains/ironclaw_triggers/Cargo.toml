[package]
name = "ironclaw_triggers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scheduled trigger domain and source-provider contracts for IronClaw Reborn"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
chrono-tz = { workspace = true }
cron = "0.17"
hex = { workspace = true }
deadpool-postgres = { workspace = true }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_libsql_runtime = { path = "../../substrates/ironclaw_libsql_runtime" }
# Host-trusted ingress minting (PROPOSAL §6.4.3) validates the prompt it seals
# into a `TrustedTriggerSubmitRequest`. `ironclaw_safety` is a same-layer,
# I/O-free `substrates` leaf, so this is a peer edge, not a reach upward.
ironclaw_safety = { path = "../../substrates/ironclaw_safety" }
libsql = { workspace = true, features = ["remote", "tls"] }
tokio-postgres = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
ulid = { version = "3", features = ["serde"] }

[dev-dependencies]
ironclaw_common = { path = "../../contracts/ironclaw_common" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
tempfile = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
