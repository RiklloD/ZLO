[package]
name = "ironclaw_web_app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web Push (RFC 8030/8291/8292) subscription records, payload encryption, and request planning for the web app notification channel"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
# ES256 keygen (VAPID) + ECDH P-256 / HKDF-SHA256 / AES-128-GCM (RFC 8291
# aes128gcm content encryption). Already linked workspace-wide via
# jsonwebtoken's aws_lc_rs backend; no new lockfile entry.
aws-lc-rs = "1"
base64 = { workspace = true }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
