[package]
name = "ironclaw_trace_commons"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Dev-only seam (`.claude/rules/cargo-features.md`: dev-only seam). Makes an
# unset process-global Trace Commons base resolve to an isolated temp dir
# (`location::base_dir`) and exposes the leak probe, so no test build can read
# or write the developer's real `~/.ironclaw/trace_contributions`. Shipping
# builds never enable it; the `zlo` binary binds its home explicitly.
test-support = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
dirs = { workspace = true }
ed25519-dalek = { version = "2.2.0", features = ["std", "rand_core", "zeroize"] }
hex = { workspace = true }
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.1" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_llm = { path = "../ironclaw_llm", version = "0.1.0" }
ironclaw_safety = { path = "../../substrates/ironclaw_safety", version = "0.2.2" }
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
rand_core = { version = "0.6", features = ["getrandom"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "rustls", "stream"] }
rust_decimal = { workspace = true, features = ["serde", "serde-with-str", "maths"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# `CancellationToken` for the periodic queue-flush worker's shutdown handle
# (`capture::spawn_trace_queue_flush_worker`).
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
tempfile = { workspace = true }

[lints]
workspace = true
