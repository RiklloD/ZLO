[package]
name = "ironclaw_memory"
version = "0.1.0"
edition.workspace = true
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Provider-neutral memory contract types for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
# Required by `MemoryServiceProfileSetRequest::from_tool_input`, which validates
# IANA timezone names; the constructor must stay an inherent method on the
# contract type so the existing consumer call site is unchanged.
chrono-tz = { workspace = true }
hex = { workspace = true }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Required only by `DocumentMetadata::from_value`, which logs a diagnostic on
# deserialize failure; preserved to keep behavior identical to the impl crate.
tracing = { workspace = true }

[features]
# Dev-only `test-support` seam (cargo-features rule bar 4): exposes the
# provider-level `MemoryService` contract suite (`test_support`) to downstream
# provider crates' integration tests, enabled only via [dev-dependencies].
# Zero bytes in production builds.
test-support = []

[dev-dependencies]
# Test substrate only: drives the async `MemoryService` default-impl unit test.
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
