[package]
name = "ironclaw_extractors"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Type-aware text extraction for IronClaw: turn a file's bytes (PDF, OOXML, legacy Office, RTF, text/code) into plain text, independent of where the file came from."
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.2" }
pdf-extract = "0.12"
thiserror = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
