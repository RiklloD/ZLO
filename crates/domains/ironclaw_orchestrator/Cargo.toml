[package]
name = "ironclaw_orchestrator"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Thread orchestration engine for IronClaw: durable queue, delegation tree, forks, restart and usage-limit recovery"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1"
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
# Profile settings are persisted in their wire shape (`profiles::ProfileSettings`).
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts" }
# Hand-written SQL store on the shared admission runtime, the same shape as
# `ironclaw_triggers` (ADR 0003): orchestration rows are relational
# (parent/child trees, ordered queues, conditional status transitions).
ironclaw_libsql_runtime = { path = "../../substrates/ironclaw_libsql_runtime" }
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
