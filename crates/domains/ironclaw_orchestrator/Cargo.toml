[package]
name = "ironclaw_orchestrator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Thread orchestration engine for IronClaw: durable queue, delegation tree, forks, restart and usage-limit recovery"
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
# Profile settings are persisted in their wire shape (`profiles::ProfileSettings`).
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts" }
# Hand-written SQL store on the shared admission runtime, the same shape as
# `ironclaw_triggers` (ADR 0003): orchestration rows are relational
# (parent/child trees, ordered queues, conditional status transitions).
ironclaw_libsql_runtime = { path = "../../substrates/ironclaw_libsql_runtime" }
libsql = { workspace = true, features = ["remote", "tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Webhook schedules: optional HMAC-SHA256 request signatures.
base64 = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
# `.zlo/worktree.toml`, the project's worktree setup commands.
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process", "fs"] }

[lints]
workspace = true
