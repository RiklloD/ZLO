[package]
name = "ironclaw_cli_providers"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Coding-agent CLI drivers (Claude CLI, Antigravity, Muse Code) as ironclaw_orchestrator turn runtimes"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1"
# Attached pictures go to Claude and Codex inline, base64-encoded.
base64 = "0.23"
# Plan updates carry their wall-clock time; session import reads transcript
# and rollout timestamps (RFC 3339).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Wire types for the CLI's stream-json protocol. Pinned exactly to the CLI
# version the driver is tested against (`claude::EXPECTED_CLI_VERSION`); bump
# both together, on purpose. Types only: the driver owns process handling.
claude-codes = { version = "=2.1.318", default-features = false, features = ["types"] }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
# Approval reasons are redacted before they reach a card.
ironclaw_safety = { path = "../../substrates/ironclaw_safety" }
ironclaw_orchestrator = { path = "../ironclaw_orchestrator" }
# Session import settings and report shapes (`session_import`).
# Context-report categories (what ZLO injects into a CLI prompt).
# `ThreadAction` / `ReviewTarget`: the runtime-action vocabulary the
# orchestrator's `TurnRuntime::thread_action` seam takes.
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts" }
# Stop kills the CLI's whole process group (tool subprocesses included).
# `fs`: session import opens transcripts with O_NOFOLLOW | O_NONBLOCK.
nix = { version = "0.31", default-features = false, features = ["signal", "fs"] }
# Question records are stored as typed JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session import: digests of a checkpoint's preceding bytes and message keys.
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }
tracing = "0.1"
# v7: Muse command and session ids are UUIDv7. v5: imported sessions get a
# stable thread id per caller and session.
uuid = { version = "1", features = ["v4", "v5", "v7"] }

[dev-dependencies]
# The approval-record test opens the orchestrator store over a real libSQL file.
ironclaw_libsql_runtime = { path = "../../substrates/ironclaw_libsql_runtime" }
libsql = { version = "0.10", default-features = false, features = ["core"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
