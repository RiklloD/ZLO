[package]
name = "ironclaw_notifications"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Durable user notification inbox records for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
hex = { workspace = true }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
libsql = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
