[package]
name = "ironclaw_conversations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Conversation binding and session thread contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_triggers = { path = "../ironclaw_triggers", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
ironclaw_triggers = { path = "../ironclaw_triggers", version = "0.1.0", features = ["test-support"] }
# Dev-only, and deliberately not a normal dependency (WS5 port inversion). This
# crate's production code no longer names the turn kernel at all — the
# orchestration reaches it through the `ConversationTurnSubmitter` port that
# `ironclaw_composition` implements. The test fakes stand in for that
# composition adapter, so they mint the same `SubmitTurnRequest`
# (`product_context` included, via `product_context::resolve_inbound`) the real
# adapter mints. Keeping the fakes on the real request shape is what lets the
# run-origin guards — including
# `untrusted_trigger_adapter_records_product_inbound_not_scheduled_trigger`,
# the proof that an untrusted adapter cannot spoof trusted-trigger
# classification — keep asserting on the exact value that reaches the
# coordinator instead of a paraphrase of it.
ironclaw_turns = { path = "../../kernel/ironclaw_turns", version = "0.1.0" }
# FaultInjecting: drive the durable store through real backend failures and count its reads.
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
