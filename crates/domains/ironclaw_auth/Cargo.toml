[package]
name = "ironclaw_auth"
version = "0.1.0"
edition.workspace = true
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Product-facing Reborn auth contracts and fake services"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Compile the panic-on-violation conformance harnesses in `test_support`. Off
# by default so production binaries carry zero bytes of the assertion suites;
# this crate's own tests and downstream crates enable it from
# `[dev-dependencies]`.
test-support = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
deadpool-postgres = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.2" }
ironclaw_event_log = { path = "../../events/ironclaw_event_log" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
# The product-facing auth ports declared in `channel_connection.rs` and
# `product_prompt.rs` error with `ProductSurfaceError` and carry
# `ChannelConnectionRequirement` / `BlockedAuthPromptRequest`: their callers are
# product surfaces. `ironclaw_product_contracts` is the neutral product-tier
# contract crate and sits in the `contracts` layer, so this is a downward edge
# like `host_api` — never a dependency on `ironclaw_assistant` itself. Same shape
# and same rationale as `ironclaw_attachments`' landing/read ports.
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts", version = "0.1.0" }
ironclaw_secrets = { path = "../../substrates/ironclaw_secrets" }
# Compile-time Mozilla Public Suffix List: DCR issuer/resource origin binding
# needs real eTLD+1 resolution (naive label-splitting treats every `*.co.uk`
# as one registrable domain — the PR #6116 security-high finding). Static data
# baked into the binary; no runtime list fetch or I/O.
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
static_assertions = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
# Self-reference with `test-support` so this crate's own `tests/` integration
# binaries (which link the lib as an external crate, without `cfg(test)`) can
# reach `ironclaw_auth::test_support`.
ironclaw_auth = { path = ".", features = ["test-support"] }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
toml = { workspace = true }

[lints]
workspace = true
