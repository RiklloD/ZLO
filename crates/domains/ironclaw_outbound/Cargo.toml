[package]
name = "ironclaw_outbound"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Outbound egress policy and delivery-attempt storage for IronClaw Reborn"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Exposes `test_support` in-memory-backed store constructors for downstream
# crates' tests. Ships zero bytes in production binaries.
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
hex = { workspace = true }
ironclaw_attachments = { path = "../ironclaw_attachments" }
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }

[dev-dependencies]
libsql = { workspace = true, features = ["remote", "tls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
