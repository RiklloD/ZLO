[package]
name = "ironclaw_skills"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Skill selection, scoring, and management for IronClaw"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
# Internal-only workspace: nothing here is published (PROPOSAL §11.3).
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[package.metadata.dist]
dist = false

[dependencies]
async-trait = { workspace = true }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_norway = "0.9"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# The usage-store contract reopens a real libSQL root filesystem.
libsql = { workspace = true }
# FaultInjecting decorator: test store fault paths through the real store.
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
