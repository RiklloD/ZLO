[package]
name = "ironclaw_libsql_runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Shared libSQL connection admission runtime for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
libsql = { workspace = true, features = ["remote", "tls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
