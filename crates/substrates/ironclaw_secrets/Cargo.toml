[package]
name = "ironclaw_secrets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
aes-gcm = "0.11"
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
hkdf = "0.13"
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
rand = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# Dev-only seams for the lease-listing conformance suite: `FaultInjecting`
# (op-recorder, to pin the no-N+1 listing) and the isolated-PostgreSQL
# provisioner. Never enabled by a shipped artifact.
ironclaw_filesystem = { path = "../ironclaw_filesystem", features = ["test-support"] }
# libSQL leg of the lease-listing conformance suite.
libsql = { workspace = true }
# PostgreSQL leg of the lease-listing conformance suite: `DATABASE_URL` when
# set (one isolated database per test), else a testcontainers server.
deadpool-postgres = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio-postgres = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
