[package]
name = "ironclaw_secrets"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
aes-gcm = "0.11"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hkdf = "0.13"
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
rand = "0.10"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# Dev-only seams for the lease-listing conformance suite: `FaultInjecting`
# (op-recorder, to pin the no-N+1 listing) and the isolated-PostgreSQL
# provisioner. Never enabled by a shipped artifact.
ironclaw_filesystem = { path = "../ironclaw_filesystem", features = ["test-support"] }
# libSQL leg of the lease-listing conformance suite.
libsql = { version = "0.9", default-features = false, features = ["core"] }
# PostgreSQL leg of the lease-listing conformance suite: `DATABASE_URL` when
# set (one isolated database per test), else a testcontainers server.
deadpool-postgres = "0.14"
testcontainers-modules = { version = "0.12", features = ["postgres"] }
tokio-postgres = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
