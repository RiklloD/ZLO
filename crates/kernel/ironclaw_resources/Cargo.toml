[package]
name = "ironclaw_resources"
version = "0.1.0"
edition.workspace = true
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Resource reservation governor for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# Exposes `test_support` in-memory-backed store constructors for downstream
# crates' tests. Disabled by default; enable only from [dev-dependencies].
test-support = []

[dependencies]
chrono = { workspace = true, default-features = true, features = ["serde"] }
chrono-tz = { workspace = true, features = ["serde"] }
fs2 = "0.4"
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
rust_decimal = { workspace = true, features = ["serde", "serde-with-str"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
async-trait = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
