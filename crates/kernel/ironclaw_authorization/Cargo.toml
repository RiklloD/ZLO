[package]
name = "ironclaw_authorization"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# In-memory-backed capability-lease store constructor for this crate's own tests
# and downstream integration tiers. The store itself is the production
# `CapabilityLeaseStore<InMemoryBackend>`; the helper just wires the
# in-memory backend seam (arch-simplification §4.3).
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_trust = { path = "../ironclaw_trust" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# FaultInjecting decorator: fold the hand-rolled `CountingFilesystem` op-recorder
# onto the real backend seam so tests assert on genuine `list_dir` traffic.
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
