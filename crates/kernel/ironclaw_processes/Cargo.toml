[package]
name = "ironclaw_processes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# In-memory-backed process store constructors for this crate's own tests and
# downstream tiers. The stores are the production `FilesystemProcess*Store<InMemoryBackend>`;
# the helpers just wire the in-memory backend seam (arch-simplification §4.3).
test-support = []

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
futures = { workspace = true }
hex = { workspace = true }
ironclaw_event_log = { path = "../../events/ironclaw_event_log" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_resources = { path = "../ironclaw_resources" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# FaultInjecting decorator: test store fault paths through the real store
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
libsql = { workspace = true, features = ["remote", "tls"] }
deadpool-postgres = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[lints]
workspace = true
