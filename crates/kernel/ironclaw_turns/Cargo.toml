[package]
name = "ironclaw_turns"
version = "0.1.0"
edition.workspace = true
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Host-layer turn coordination contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# Process-backed agent-turn fixtures for cross-crate tests.
test-support = ["ironclaw_host_api/test-support"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_loop_contracts = { path = "../../contracts/ironclaw_loop_contracts", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_observability = { path = "../../substrates/ironclaw_observability" }
ironclaw_processes = { path = "../ironclaw_processes", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
# Self-reference so the crate's own integration tests see `test_support`.
ironclaw_turns = { path = ".", features = ["test-support"] }
ironclaw_processes = { path = "../ironclaw_processes", features = ["test-support"] }
# FaultInjecting decorator: drive store fault paths through the real
# the production process-backed projection instead of hand-rolled trait fakes.
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0", features = [
    "test-support",
] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
    "time",
] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
