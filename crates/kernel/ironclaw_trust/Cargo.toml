[package]
name = "ironclaw_trust"
version = "0.1.0"
edition.workspace = true
# Keep in sync with the workspace-level package.rust-version.
rust-version.workspace = true
description = "Host-controlled trust-class policy engine for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[dependencies]
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
chrono = { workspace = true, default-features = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
static_assertions = { workspace = true }

[lints]
workspace = true
